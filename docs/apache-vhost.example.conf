<VirtualHost *:8080>
    ServerName zrodlo-slowa.local
    DocumentRoot "X:/zrodlo-slowa/public"

    <Directory "X:/zrodlo-slowa/public">
        Options -Indexes
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog "logs/zrodlo-slowa-error.log"
    CustomLog "logs/zrodlo-slowa-access.log" combined
</VirtualHost>
